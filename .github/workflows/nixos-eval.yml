name: Evaluate NixOS configurations
on:
  push:
    branches:
      - "renovate/*"
permissions: {}
jobs:
  eval:
    name: Evaluate NixOS configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        shell: bash
        run: |
          if [[ -z $(command -v nix) ]]; then
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.lix.systems/lix | sh -s -- install --no-confirm --extra-conf "
              trusted-users = $(whoami)
              access-tokens = github.com=$GITHUB_TOKEN
            "
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate NixOS configurations
        shell: bash
        run: |
          mapfile -t configurations < <(nix eval --json '.#nixosConfigurations' --apply 'builtins.attrNames' | jq -r '.[]')
          for configuration in "${configurations[@]}"; do
            echo "Evaluating $configuration"
            nix eval ".#nixosConfigurations.${configuration}.config.system.build.toplevel.drvPath"
          done
