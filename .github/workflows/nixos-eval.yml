name: Evaluate NixOS configurations
on:
  push:
    branches:
      - "renovate/*"
permissions: {}
jobs:
  eval:
    name: Evaluate NixOS configurations
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        shell: bash
        run: |
          if [[ -z $(command -v nix) ]]; then
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.lix.systems/lix | sh -s -- install --no-confirm --extra-conf "
              trusted-users = $(whoami)
              access-tokens = github.com=$GITHUB_TOKEN
            "
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate NixOS configurations
        shell: bash
        run: |
          mapfile -t configurations < <(nix eval --json '.#nixosConfigurations' --apply 'builtins.attrNames' | jq -r '.[]')
          for configuration in "${configurations[@]}"; do
            system=$(nix eval --raw ".#nixosConfigurations.${configuration}.config.nixpkgs.system")
            case "$(uname -m)" in
              x86_64) current_system=x86_64-linux ;;
              aarch64) current_system=aarch64-linux ;;
              *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
            esac
            if [[ "$system" != "$current_system" ]]; then
              echo "Skipping $configuration ($system; runner is $current_system)"
              continue
            fi
            echo "Evaluating $configuration"
            nix eval ".#nixosConfigurations.${configuration}.config.system.build.toplevel.drvPath"
          done
